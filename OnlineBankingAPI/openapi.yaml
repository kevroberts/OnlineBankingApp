openapi: 3.1.0
info:
  title: OnlineBankingAPI
  version: 1.1.0
  description: |
    Contract for the OnlineBankingAPI prototype (ASP.NET Core Web API on .NET 10, PostgreSQL).
    Customers sign in, view accounts and transaction history, transfer money between their own
    accounts or to saved payees, and ask a read-only AI banking assistant about their own data.
    All data is seeded demo data. This file matches the implemented API (2026-10-26); the running
    API also serves its own generated document at /openapi/v1.json and Scalar at /scalar/v1.

    Conventions: JSON camelCase; money as numbers with 2 decimals (stored as numeric(19,4) in PostgreSQL);
    timestamps ISO 8601 UTC; errors are RFC 9457 Problem Details with a stable `code`.
    A resource that is not the caller's returns 404.

    Limits: sign-in allows 10 attempts per minute per IP. Every signed-in request counts against
    60 requests per minute per session; past that, any endpoint returns 429 rate_limited with
    Retry-After. Any endpoint can return 500 internal_error.

    Not in this contract: POST /demo/reset, which exists only in the Demo environment.
servers:
  - url: https://localhost:7294/api/v1
    description: Local development (https profile)
  - url: http://localhost:5119/api/v1
    description: Local development (http profile)
security:
  - sessionCookie: []
  - bearerSession: []
tags:
  - name: Auth
  - name: Accounts
  - name: Transactions
  - name: Payees
  - name: Transfers
  - name: Assistant

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in and start a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. Also sets the obk_session cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: obk_session=<token>; HttpOnly; Secure; SameSite=Strict; Path=/
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '423':
          description: Account locked after too many failed attempts (code account_locked)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      description: Also drops the session's assistant chats. Needs no valid session, so it always succeeds.
      operationId: logout
      security: [{}, { sessionCookie: [] }, { bearerSession: [] }]
      responses:
        '204': { description: Session revoked (if any) and cookie expired. Safe to repeat. }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current customer (session check)
      operationId: getCurrentCustomer
      responses:
        '200':
          description: The signed-in customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /accounts:
    get:
      tags: [Accounts]
      summary: List the customer's accounts with current balances
      operationId: listAccounts
      responses:
        '200':
          description: Accounts, checking first then by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      summary: Get one account
      operationId: getAccount
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The account
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '304': { description: Not modified }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountId}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Transactions]
      summary: Transaction history, newest first, with filters, search, paging and running balance
      operationId: listTransactions
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Inclusive start date in the bank's time zone
        - in: query
          name: to
          schema: { type: string, format: date }
          description: Inclusive end date in the bank's time zone
        - in: query
          name: type
          schema: { $ref: '#/components/schemas/Direction' }
        - in: query
          name: q
          schema: { type: string, minLength: 2, maxLength: 100 }
          description: Case-insensitive contains-match on description, counterparty and note
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque nextCursor from the previous page; only valid with the same filters
      responses:
        '200':
          description: A page of ledger entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountId}/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - in: path
        name: transactionId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Transactions]
      summary: Get one transaction
      operationId: getTransaction
      responses:
        '200':
          description: The transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payees:
    get:
      tags: [Payees]
      summary: List the customer's saved payees
      operationId: listPayees
      responses:
        '200':
          description: Payees ordered by nickname
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayeeList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /transfers/quotes:
    post:
      tags: [Transfers]
      summary: Validate a transfer and return the confirmation summary
      description: Moves no money and places no hold. The quote is valid for 5 minutes and can be executed once.
      operationId: createTransferQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferQuoteRequest' }
      responses:
        '201':
          description: Quote created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferQuote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /transfers:
    get:
      tags: [Transfers]
      summary: Recent transfers, newest first
      operationId: listTransfers
      parameters:
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: A page of transfers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Transfers]
      summary: Execute a confirmed quote exactly once
      description: |
        Requires an Idempotency-Key. A repeat with the same key and body replays the first response
        (header Idempotent-Replayed: true) and moves no money. The same key with a different body is
        rejected with 422 idempotency_key_reused. A quote already executed under another key returns
        409 quote_already_used with the existing transferId.
      operationId: executeTransfer
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteTransferRequest' }
      responses:
        '201':
          description: Transfer completed (or replayed)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed:
              schema: { type: boolean }
              description: Present and true when this is a replay of an earlier response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: quote_already_used (body has transferId) or request_in_progress (Retry-After set)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /transfers/{transferId}:
    parameters:
      - in: path
        name: transferId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Transfers]
      summary: Get a transfer result
      operationId: getTransfer
      responses:
        '200':
          description: The transfer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assistant/messages:
    post:
      tags: [Assistant]
      summary: Ask the read-only banking assistant a question
      description: |
        Answers from the signed-in customer's own accounts, as Server-Sent Events. Omit conversationId
        (or send null) to start a chat; send the id from the `conversation` event to continue it.
        The assistant is read-only: its only tools are list_accounts and search_transactions.
        Without an Anthropic API key on the API it gives demo answers (`mode: mock`).

        Events, each `event: <name>` plus `data: <json>`:
        - `conversation` {conversationId, mode: claude | mock}, first
        - `status` {tool}, when the assistant looks something up
        - `text` {delta}, pieces of the answer
        - `done` {stopReason}, last on success
        - `error` {code: conversation_expired | assistant_unavailable | assistant_declined, detail}, last on failure
      operationId: askAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantMessageRequest' }
      responses:
        '200':
          description: The answer, streamed
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /assistant/conversations/{conversationId}:
    parameters:
      - in: path
        name: conversationId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Assistant]
      summary: End a chat (the API forgets it)
      operationId: endAssistantConversation
      responses:
        '204': { description: Ended }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: obk_session
    bearerSession:
      type: http
      scheme: bearer
      description: The same opaque session token, for non-browser clients

  parameters:
    AccountId:
      in: path
      name: accountId
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: bad_request, invalid_date_range, invalid_cursor or idempotency_key_required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: unauthenticated or invalid_credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: not_found (missing, or not the caller's)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: validation_failed or a single rule code (see FieldError.code)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: rate_limited
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Money:
      type: number
      multipleOf: 0.01
      examples: [200.00]

    Direction:
      type: string
      enum: [debit, credit]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 50, examples: [alice] }
        password: { type: string, maxLength: 128, format: password }

    LoginResponse:
      type: object
      required: [customer, sessionToken, expiresAt]
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
        sessionToken: { type: string }
        expiresAt: { type: string, format: date-time }

    Customer:
      type: object
      required: [id, displayName, username]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        username: { type: string }

    Account:
      type: object
      required: [id, type, name, maskedNumber, currency, balance, availableBalance, asOf]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [checking, savings] }
        name: { type: string }
        maskedNumber: { type: string, examples: ['****4821'] }
        currency: { type: string, examples: [USD] }
        balance: { $ref: '#/components/schemas/Money' }
        availableBalance: { $ref: '#/components/schemas/Money' }
        asOf: { type: string, format: date-time }

    AccountList:
      type: object
      required: [items, totalBalance]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        totalBalance: { $ref: '#/components/schemas/Money' }

    Transaction:
      type: object
      required: [id, postedAt, description, type, amount, signedAmount, runningBalance, category]
      properties:
        id: { type: string, format: uuid }
        postedAt: { type: string, format: date-time }
        description: { type: string }
        counterparty: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/Direction' }
        amount:
          $ref: '#/components/schemas/Money'
          description: Always positive
        signedAmount: { $ref: '#/components/schemas/Money' }
        runningBalance:
          $ref: '#/components/schemas/Money'
          description: Account balance immediately after this entry; unaffected by filters
        category: { type: string, enum: [transfer, payment, deposit, card, fee, interest] }
        note: { type: [string, 'null'] }
        transferId: { type: [string, 'null'], format: uuid }

    PageInfo:
      type: object
      required: [pageSize, hasMore]
      properties:
        pageSize: { type: integer }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    TransactionPage:
      type: object
      required: [accountId, items, page, totalCount]
      properties:
        accountId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        page: { $ref: '#/components/schemas/PageInfo' }
        totalCount: { type: integer }

    Payee:
      type: object
      required: [id, nickname, name, bankName, maskedAccountNumber]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        name: { type: string }
        bankName: { type: string }
        maskedAccountNumber: { type: string }
        category: { type: string }

    PayeeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Payee' }

    Destination:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [account, payee] }
        id: { type: string, format: uuid }

    TransferQuoteRequest:
      type: object
      required: [sourceAccountId, destination, amount]
      properties:
        sourceAccountId: { type: string, format: uuid }
        destination: { $ref: '#/components/schemas/Destination' }
        amount: { $ref: '#/components/schemas/Money' }
        note: { type: [string, 'null'], maxLength: 140 }

    AccountRef:
      type: object
      required: [id, name, maskedNumber]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        maskedNumber: { type: string }

    DestinationRef:
      type: object
      required: [kind, id, name, maskedNumber]
      properties:
        kind: { type: string, enum: [account, payee] }
        id: { type: string, format: uuid }
        name: { type: string }
        maskedNumber: { type: string }

    TransferQuote:
      type: object
      required: [quoteId, source, destination, amount, fee, sourceBalanceAfter, expiresAt]
      properties:
        quoteId: { type: string, format: uuid }
        source:
          allOf:
            - $ref: '#/components/schemas/AccountRef'
            - type: object
              properties:
                balance: { $ref: '#/components/schemas/Money' }
        destination: { $ref: '#/components/schemas/DestinationRef' }
        amount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        note: { type: [string, 'null'] }
        sourceBalanceAfter: { $ref: '#/components/schemas/Money' }
        expiresAt: { type: string, format: date-time }

    ExecuteTransferRequest:
      type: object
      required: [quoteId]
      properties:
        quoteId: { type: string, format: uuid }

    Transfer:
      type: object
      required: [id, reference, status, source, destination, amount, debitTransactionId, creditTransactionId, createdAt]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, examples: [TRF-20261021-000123] }
        status: { type: string, enum: [completed] }
        source:
          allOf:
            - $ref: '#/components/schemas/AccountRef'
            - type: object
              properties:
                balanceAfter: { $ref: '#/components/schemas/Money' }
        destination:
          allOf:
            - $ref: '#/components/schemas/DestinationRef'
            - type: object
              properties:
                balanceAfter:
                  $ref: '#/components/schemas/Money'
                  description: Present only for own-account transfers
        amount: { $ref: '#/components/schemas/Money' }
        note: { type: [string, 'null'] }
        debitTransactionId: { type: string, format: uuid }
        creditTransactionId:
          type: string
          format: uuid
          description: For payee payments, the credit is on the bank's clearing account and is not visible to the customer
        createdAt: { type: string, format: date-time }

    TransferPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transfer' }
        page: { $ref: '#/components/schemas/PageInfo' }

    AssistantMessageRequest:
      type: object
      required: [text]
      properties:
        conversationId: { type: [string, 'null'], format: uuid }
        text: { type: string, minLength: 1, examples: ['What is my checking balance?'] }

    FieldError:
      type: object
      required: [code, message]
      properties:
        field: { type: [string, 'null'] }
        code:
          type: string
          enum:
            - amount_not_positive
            - amount_invalid_precision
            - destination_not_found
            - same_account
            - insufficient_funds
            - account_not_active
            - note_invalid
            - quote_expired
            - idempotency_key_reused
        message: { type: string }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        traceId: { type: string }
        transferId:
          type: string
          format: uuid
          description: Present on 409 quote_already_used
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
