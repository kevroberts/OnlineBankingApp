# Local PostgreSQL 17 for OnlineBankingAPI. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onlinebanking
    ports:
      - "5432:5432"
    volumes:
      - onlinebanking-pg:/var/lib/postgresql/data

volumes:
  onlinebanking-pg:
